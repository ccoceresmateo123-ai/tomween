
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOMWEEN | Comunidad Tom</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:white;text-align:center;font-family:Arial,sans-serif;background:radial-gradient(circle at 50% 30%,#7225a4,#200a35 75%)}
main{max-width:950px;margin:auto;padding:12px}
.pantalla{display:none}
.pantalla.activa{display:block}
h1{color:#ffbf35;text-shadow:0 3px 10px #ff7100;font-size:clamp(24px,5vw,42px)}
h2{color:#ffe49c}
.btn{border:2px solid #ffe59b;border-radius:40px;background:linear-gradient(#ffdc65,#ff8c12);color:#38133e;font-size:clamp(17px,4vw,24px);font-weight:bold;padding:15px 27px;margin:17px auto;cursor:pointer;box-shadow:0 6px 0 #9e3b0d,0 0 20px #ff8b00aa}
.btn:active{transform:translateY(3px)}
.audio{position:fixed;z-index:30;right:10px;top:10px;border:2px solid #ffcb65;border-radius:50px;background:#260c3fe8;color:white;padding:10px 12px;font-size:15px;cursor:pointer}
.portada{width:100%;max-width:720px;border-radius:20px;display:block;margin:18px auto;box-shadow:0 0 25px #ff860055}
.sub{font-size:clamp(16px,3vw,21px);font-weight:bold}

/* FONDO DE HALLOWEEN Y BOTONES INVISIBLES */

.escenario{position:relative;width:100%;aspect-ratio:3/2;margin:10px auto;border-radius:14px;overflow:hidden;box-shadow:0 0 35px #ff8c00a8;background:#35154d}
.fondo-juego{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}
.zona{position:absolute;z-index:2;border:0;background:transparent;cursor:pointer;border-radius:50%;-webkit-tap-highlight-color:transparent}
.zona:hover,.zona:focus-visible{outline:3px solid #ffde6b;background:#ffb52c20}

/* POSICIONES DE LOS SEIS DISFRACES */

.z1{left:11%;top:10%;width:22%;height:27%}
.z2{left:7%;top:34%;width:24%;height:25%}
.z3{left:10%;top:57%;width:23%;height:29%}
.z4{right:8%;top:10%;width:23%;height:27%}
.z5{right:6%;top:35%;width:24%;height:25%}
.z6{right:10%;top:58%;width:23%;height:29%}

/* PANTALLA DEL PREMIO */

.premio-box{max-width:700px;margin:15px auto;padding:20px;background:radial-gradient(circle at top,#913bb8,#260b45 85%);border:3px solid #ffbf35;border-radius:24px;box-shadow:0 0 28px #ff8c0077}
.premio-box img{width:85%;max-width:350px;max-height:380px;object-fit:contain}
.premio{font-size:clamp(36px,8vw,60px);font-weight:900;color:#ffcf3b;text-shadow:0 0 16px #ff8500}

@media(max-width:600px){
main{padding:8px}
.escenario{border-radius:8px}
.audio{font-size:13px;padding:8px 10px}
#inicio h1{padding-top:36px}
}
</style>
</head>
<body>

<button class="audio" id="audioBtn" onclick="alternarMusica()" aria-label="Activar o silenciar música">🔇 Música</button>

<main>

<!-- PANTALLA 1: BIENVENIDA -->

<section class="pantalla activa" id="inicio">
<h1>🎃 COMUNIDAD TOM 🎃</h1>
<h2>👻 ¡FELIZ HALLOWEEN! 👻</h2>

<img class="portada" src="portada.png" alt="Logo de Comunidad Tom Halloween">

<p class="sub">¡Una noche de disfraces, sorpresas y premios!</p>

<button class="btn" onclick="continuar()">🎃 CONTINUAR 🎃</button>
</section>

<!-- PANTALLA 2: TOM Y LOS SEIS DISFRACES -->

<section class="pantalla" id="seleccion">

<div class="escenario">

<img class="fondo-juego" src="fondo-halloween.png" alt="Tom con su calabaza y seis disfraces de Halloween">

<button class="zona z1" onclick="elegir(0)" aria-label="Elegir vampiro" title="Vampiro"></button>

<button class="zona z2" onclick="elegir(1)" aria-label="Elegir fantasma" title="Fantasma"></button>

<button class="zona z3" onclick="elegir(2)" aria-label="Elegir momia" title="Momia"></button>

<button class="zona z4" onclick="elegir(3)" aria-label="Elegir diablo" title="Diablo"></button>

<button class="zona z5" onclick="elegir(4)" aria-label="Elegir brujo" title="Brujo"></button>

<button class="zona z6" onclick="elegir(5)" aria-label="Elegir esqueleto" title="Esqueleto"></button>

</div>

<button class="btn" onclick="mostrar('inicio')">⬅ VOLVER</button>
</section>

<!-- PANTALLA 3: PREMIO -->

<section class="pantalla" id="resultado">

<div class="premio-box">

<h1>🎉 ¡TRUCO O TRATO! 🎉</h1>

<h2 id="nombre"></h2>

<img id="foto" alt="Tom disfrazado">

<h2>🎁 ¡FELICIDADES! GANASTE 🎁</h2>

<div class="premio" id="premio"></div>

<p class="sub" id="detalle"></p>

<button class="btn" onclick="mostrar('seleccion')">🎃 VOLVER A JUGAR</button>

</div>
</section>

</main>

<script>

/* DISFRACES Y PREMIOS */

const opciones=[
{nombre:'Vampiro',premio:'30%',imagen:'vampiro.png',tipo:'bono'},
{nombre:'Fantasma',premio:'20%',imagen:'fantasma.png',tipo:'bono'},
{nombre:'Momia',premio:'15%',imagen:'momia.png',tipo:'bono'},
{nombre:'Diablo',premio:'10%',imagen:'diablo.png',tipo:'bono'},
{nombre:'Brujo',premio:'1.000 FICHAS',imagen:'brujo.png',tipo:'fichas'},
{nombre:'Esqueleto',premio:'500 FICHAS',imagen:'esqueleto.png',tipo:'fichas'}
];

/* CAMBIAR DE PANTALLA */

function mostrar(id){
document.querySelectorAll('.pantalla').forEach(e=>e.classList.remove('activa'));
document.getElementById(id).classList.add('activa');
window.scrollTo(0,0);
}

/* ELEGIR DISFRAZ */

function elegir(n){
const o=opciones[n];

document.getElementById('nombre').textContent='Tom se disfrazó de '+o.nombre;
document.getElementById('foto').src=o.imagen;
document.getElementById('premio').textContent=o.premio;

document.getElementById('detalle').textContent=
o.tipo==='bono'
?'DE BONIFICACIÓN EN TU PRÓXIMA CARGA'
:'PARA TU PRÓXIMA CARGA';

mostrar('resultado');
sonidoPremio();
}

/* MÚSICA DE HALLOWEEN */

let ctx=null;
let musicaActiva=false;
let intervalo=null;
let paso=0;

const notas=[
392,0,466.16,392,
349.23,0,311.13,349.23,
392,0,293.66,311.13,
261.63,0,293.66,0
];

function nota(f,d=0.18,vol=0.045,tipo='sine'){
if(!ctx||!f)return;

const osc=ctx.createOscillator();
const g=ctx.createGain();

osc.type=tipo;
osc.frequency.value=f;

g.gain.setValueAtTime(0.0001,ctx.currentTime);
g.gain.exponentialRampToValueAtTime(vol,ctx.currentTime+0.025);
g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+d);

osc.connect(g);
g.connect(ctx.destination);

osc.start();
osc.stop(ctx.currentTime+d+0.02);
}

function tocarPaso(){
nota(notas[paso%notas.length],0.28,0.035,'triangle');

if(paso%4===0){
nota(130.81,0.38,0.018,'sine');
}

paso++;
}

async function alternarMusica(){

if(!ctx){
const C=window.AudioContext||window.webkitAudioContext;

if(!C){
alert('Tu navegador no permite reproducir música.');
return;
}

ctx=new C();
}

try{
await ctx.resume();
}catch(e){
return;
}

musicaActiva=!musicaActiva;

document.getElementById('audioBtn').textContent=
musicaActiva?'🔊 Música':'🔇 Música';

if(musicaActiva){
tocarPaso();
intervalo=setInterval(tocarPaso,340);
}else{
clearInterval(intervalo);
intervalo=null;
}
}

/* CONTINUAR Y COMENZAR MÚSICA */

function continuar(){
mostrar('seleccion');
if(!musicaActiva)alternarMusica();
}

/* SONIDO AL GANAR */

function sonidoPremio(){

if(!ctx||!musicaActiva)return;

[523.25,659.25,783.99,1046.5].forEach((f,i)=>{
setTimeout(()=>nota(f,0.28,0.065,'triangle'),i*140);
});

}

</script>

</body>
</html>
