<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Truco o Trato - Comunidad Tom</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle,#52226c,#13091d);color:white;text-align:center;font-family:Arial,sans-serif}
h1{color:#ffa72b;text-shadow:0 0 15px #ff6a00}
h2{color:#ffe6a2}
header{padding:24px 12px}
main{max-width:850px;margin:auto;padding:15px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.opcion{background:#38194e;border:2px solid #ac65d5;border-radius:20px;padding:20px 5px;color:white;cursor:pointer;font-size:17px}
.opcion:hover{background:#65318b;transform:scale(1.04)}
.emoji{font-size:55px;display:block;margin:10px}
#resultado{display:none;background:#301342;border:3px solid #ffb735;border-radius:25px;padding:25px;margin:20px auto;max-width:550px}
#foto{display:block;width:80%;max-width:280px;max-height:340px;object-fit:contain;margin:15px auto}
#premio{font-size:45px;color:#ffcf41;font-weight:900}
button.volver{background:#ffa72b;border:0;border-radius:25px;padding:15px 25px;font-size:18px;font-weight:bold;cursor:pointer}
@media(max-width:500px){.grid{gap:7px}.opcion{font-size:13px;padding:12px 2px}.emoji{font-size:38px}}
</style>
</head>
<body>
<header><h1>🎃 TRUCO O TRATO 🎃</h1><h2>🐱 COMUNIDAD TOM 🐱</h2><p>¡Elegí el disfraz de Tom y descubrí tu premio!</p></header>
<main>
<div id="seleccion" class="grid">
<button class="opcion" onclick="elegir(0)">1<span class="emoji">🧛</span>Vampiro</button>
<button class="opcion" onclick="elegir(1)">2<span class="emoji">👻</span>Fantasma</button>
<button class="opcion" onclick="elegir(2)">3<span class="emoji">🧻</span>Momia</button>
<button class="opcion" onclick="elegir(3)">4<span class="emoji">😈</span>Diablo</button>
<button class="opcion" onclick="elegir(4)">5<span class="emoji">🧙</span>Brujo</button>
<button class="opcion" onclick="elegir(5)">6<span class="emoji">💀</span>Esqueleto</button>
</div>
<section id="resultado">
<h1>🎉 ¡TRUCO O TRATO! 🎉</h1>
<h2 id="disfraz"></h2>
<img id="foto" alt="Tom disfrazado">
<h2>¡FELICIDADES! GANASTE</h2>
<div id="premio"></div>
<p>EN TU PRÓXIMA CARGA</p>
<button class="volver" onclick="volver()">VOLVER AL JUEGO</button>
</section>
</main>
<script>
const opciones=[
{nombre:"Vampiro",premio:"30%",imagen:"vampiro.png"},
{nombre:"Fantasma",premio:"20%",imagen:"fantasma.png"},
{nombre:"Momia",premio:"15%",imagen:"momia.png"},
{nombre:"Diablo",premio:"10%",imagen:"diablo.png"},
{nombre:"Brujo",premio:"1.000 FICHAS",imagen:"brujo.png"},
{nombre:"Esqueleto",premio:"500 FICHAS",imagen:"esqueleto.png"}
];
function elegir(n){
const o=opciones[n];
document.getElementById("seleccion").style.display="none";
document.getElementById("resultado").style.display="block";
document.getElementById("disfraz").textContent="Tom se disfrazó de "+o.nombre;
document.getElementById("premio").textContent=o.premio;
document.getElementById("foto").src="img/"+o.imagen;
}
function volver(){
document.getElementById("resultado").style.display="none";
document.getElementById("seleccion").style.display="grid";
}
</script>
</body>
</html>
