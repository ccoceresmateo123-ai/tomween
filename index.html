
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOMWEEN - Comunidad Tom</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle,#55236c,#13091d);color:white;font-family:Arial,sans-serif;text-align:center}
main{max-width:850px;margin:auto;padding:15px}
h1{color:#ffb32c;text-shadow:0 0 15px #ff7000}
h2{color:#ffe8ae}
.pantalla{display:none}
.activa{display:block}
.portada{position:relative}
.portada img{width:100%;display:block;border-radius:18px}
.bienvenida{font-size:clamp(24px,6vw,48px);font-weight:900;color:#ffbf35;text-shadow:2px 3px 8px #24002c}
button{cursor:pointer}
.boton{border:0;border-radius:30px;background:linear-gradient(135deg,#ffdb54,#ff8500);color:#2d1038;font-size:20px;font-weight:bold;padding:16px 35px;margin:18px auto;box-shadow:0 5px 20px #ff7a0066}
.boton:hover{transform:scale(1.05)}
.escenario{position:relative;width:100%;aspect-ratio:4/5;max-height:750px;background:radial-gradient(ellipse at center,#713589,#271139 75%);border:3px solid #ffad35;border-radius:24px;overflow:hidden}
.luna{position:absolute;right:7%;top:5%;font-size:55px}
.tom-central{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:clamp(75px,17vw,165px);filter:drop-shadow(0 0 15px #ffa22c)}
.tom-nombre{position:absolute;top:65%;left:50%;transform:translateX(-50%);font-size:clamp(18px,4vw,32px);font-weight:900;color:#ffbf35}
.disfraz{position:absolute;width:29%;height:28%;border:2px solid #ffb63d;border-radius:17px;background:#321348cc;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px;gap:4px}
.disfraz img{width:100%;height:78%;object-fit:contain;filter:drop-shadow(0 3px 5px #0008)}
.disfraz span{font-size:clamp(11px,2.5vw,19px);font-weight:bold}
.disfraz:hover{background:#663087;box-shadow:0 0 18px #ffad35}
.d1{left:2%;top:4%}
.d2{right:2%;top:4%}
.d3{left:2%;top:36%}
.d4{right:2%;top:36%}
.d5{left:2%;bottom:4%}
.d6{right:2%;bottom:4%}
#resultado{background:linear-gradient(#4c205d,#1b0b2a);border:3px solid #ffb735;border-radius:25px;padding:20px}
#foto{width:85%;max-width:350px;max-height:400px;object-fit:contain}
#premio{font-size:clamp(35px,8vw,55px);font-weight:900;color:#ffce40;text-shadow:0 0 15px #ff8500}
@media(max-width:500px){.escenario{aspect-ratio:3/5}.disfraz{width:31%;height:27%}.tom-central{font-size:80px}.tom-nombre{top:61%}}
</style>
</head>
<body>
<main>

<section id="inicio" class="pantalla activa">
  <h1>🎃 COMUNIDAD TOM 🎃</h1>
  <div class="portada">
    <img src="portada.png" alt="Portada de Halloween">
  </div>
  <div class="bienvenida">👻 ¡FELIZ HALLOWEEN! 👻</div>
  <p>Una noche mágica te espera con Tom...</p>
  <button class="boton" onclick="mostrar('seleccion')">🎃 CONTINUAR 🎃</button>
</section>

<section id="seleccion" class="pantalla">
  <h1>🎃 ELEGÍ EL DISFRAZ DE TOM 🎃</h1>
  <p>¡Tocá un disfraz para descubrir tu premio!</p>

  <div class="escenario">
    <div class="luna">🌕</div>
    <div class="tom-central">🐈</div>
    <div class="tom-nombre">🐾 TOM 🐾</div>

    <button class="disfraz d1" onclick="elegir(0)">
      <img src="vampiro.png" alt="Vampiro">
      <span>🧛 VAMPIRO</span>
    </button>

    <button class="disfraz d2" onclick="elegir(1)">
      <img src="fantasma.png" alt="Fantasma">
      <span>👻 FANTASMA</span>
    </button>

    <button class="disfraz d3" onclick="elegir(2)">
      <img src="momia.png" alt="Momia">
      <span>🧻 MOMIA</span>
    </button>

    <button class="disfraz d4" onclick="elegir(3)">
      <img src="diablo.png" alt="Diablo">
      <span>😈 DIABLO</span>
    </button>

    <button class="disfraz d5" onclick="elegir(4)">
      <img src="brujo.png" alt="Brujo">
      <span>🧙 BRUJO</span>
    </button>

    <button class="disfraz d6" onclick="elegir(5)">
      <img src="esqueleto.png" alt="Esqueleto">
      <span>💀 ESQUELETO</span>
    </button>
  </div>

  <button class="boton" onclick="mostrar('inicio')">⬅ VOLVER</button>
</section>

<section id="resultado" class="pantalla">
  <h1>🎉 ¡TRUCO O TRATO! 🎉</h1>
  <h2 id="nombre"></h2>
  <img id="foto" alt="Tom disfrazado">
  <h2>🎁 ¡FELICIDADES! GANASTE 🎁</h2>
  <div id="premio"></div>
  <p id="detalle"></p>
  <button class="boton" onclick="mostrar('seleccion')">🎃 VOLVER A JUGAR</button>
</section>

</main>
<script>
const opciones=[
{nombre:"Vampiro",premio:"30%",imagen:"vampiro.png",tipo:"bono"},
{nombre:"Fantasma",premio:"20%",imagen:"fantasma.png",tipo:"bono"},
{nombre:"Momia",premio:"15%",imagen:"momia.png",tipo:"bono"},
{nombre:"Diablo",premio:"10%",imagen:"diablo.png",tipo:"bono"},
{nombre:"Brujo",premio:"1.000 FICHAS",imagen:"brujo.png",tipo:"fichas"},
{nombre:"Esqueleto",premio:"500 FICHAS",imagen:"esqueleto.png",tipo:"fichas"}
];

function mostrar(id){
document.querySelectorAll(".pantalla").forEach(p=>p.classList.remove("activa"));
document.getElementById(id).classList.add("activa");
window.scrollTo(0,0);
}

function elegir(n){
const o=opciones[n];
document.getElementById("nombre").textContent="Tom se disfrazó de "+o.nombre;
document.getElementById("foto").src=o.imagen;
document.getElementById("premio").textContent=o.premio;
document.getElementById("detalle").textContent=o.tipo==="bono"?"DE BONIFICACIÓN EN TU PRÓXIMA CARGA":"PARA TU PRÓXIMA CARGA";
mostrar("resultado");
}
</script>
</body>
</html>
